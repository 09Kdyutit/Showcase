name: Security & Release Gate

# Static checks run on every main push and pull request. Live adversarial checks require
# repository variable RUN_LIVE_TESTS=true plus isolated staging/test secrets. They run only
# for same-repository pull requests or an explicit manual dispatch—never after a main push
# and never for a fork—so production deployment cannot happen before the staging gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging:
        description: Run credentialed adversarial tests against isolated staging
        required: true
        default: false
        type: boolean
      release_candidate:
        description: Also require every full production release-gate row to be PASS
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static:
    name: Static checks (no live credentials needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history — gitleaks scans the whole log, not just HEAD

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: verify.mjs (RLS/banned-phrase/key-exposure static checks)
        run: node scripts/verify.mjs

      - name: Launch growth and security invariants
        run: npm run test:launch-offline

      - name: Release contract and committed-source fingerprint
        run: node scripts/release-gate.mjs --contract-only

      - name: Build
        run: npm run build
        env:
          # Build-time only — fake values so the build doesn't fail on missing-key
          # checks; no real secret is needed to produce a build artifact.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
          RESEND_API_KEY: ci-placeholder-not-a-real-key
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_build_only

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  local_database:
    name: Local Supabase credentialed tests (no secrets)
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    concurrency:
      group: local-supabase-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start disposable Supabase, apply migrations, and run local tests
        run: npm run test:local-supabase -- --stop

  live:
    name: Staging adversarial tests
    runs-on: ubuntu-latest
    needs: [static, local_database]
    # Credentialed code runs only from reviewed main, after an explicit dispatch and the
    # protected staging-environment approval. PR code never receives provider credentials.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_staging && vars.RUN_LIVE_TESTS == 'true' }}
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: staging-adversarial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate live-test secrets
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_ID_PRO_MONTHLY }}
          STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PRO_ANNUAL }}
          STRIPE_PRICE_ID_FOUNDING_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_FOUNDING_ANNUAL }}
        run: |
          test -n "$STAGING_SUPABASE_PROJECT_REF"
          test "$STAGING_SUPABASE_PROJECT_REF" != "yogwhfrjhcbnvoxitcay"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "Stripe secret must be test mode" >&2; exit 1 ;; esac
          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in pk_test_*) ;; *) echo "Stripe publishable key must be test mode" >&2; exit 1 ;; esac
          case "$STRIPE_WEBHOOK_SECRET" in whsec_*) ;; *) echo "Stripe webhook secret is malformed" >&2; exit 1 ;; esac
          test -n "$STRIPE_PRICE_ID_PRO_MONTHLY"
          test -n "$STRIPE_PRICE_ID_PRO_ANNUAL"
          test -n "$STRIPE_PRICE_ID_FOUNDING_ANNUAL"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
          RESEND_API_KEY: ci-placeholder-not-a-real-key
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_build_only

      - name: Run staging adversarial suite
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_ID_PRO_MONTHLY }}
          STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PRO_ANNUAL }}
          STRIPE_PRICE_ID_FOUNDING_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_FOUNDING_ANNUAL }}
          LAUNCH_OPEN: 'false'
          EMAILS_ENABLED: 'false'
          LIFECYCLE_EMAILS_ENABLED: 'false'
          KILL_SWITCH_AI: 'true'
          KILL_SWITCH_GEMINI: 'true'
          KILL_SWITCH_CHECKOUT: 'true'
          KILL_SWITCH_JOBS_PROVIDER: 'true'
          KILL_SWITCH_PUBLISHING: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          touch .env.local
          npm run start &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Server did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done
          npm run test:rls
          npm run test:authorization
          npm run test:deletion
          npm run test:csrf
          npm run test:abuse
          npm run test:stripe
          EXPECT_PROD=1 npm run test:headers
          npm run test:launch-security

      - name: Full production release attestation
        if: ${{ inputs.release_candidate }}
        run: npm run release:gate
